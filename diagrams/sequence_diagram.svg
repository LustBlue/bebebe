<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="800" viewBox="0 0 1080 800">
<rect width="1080" height="800" fill="#ffffff"/>
<text x="540" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#202124">Диаграмма последовательности: «создание задачи → отчёт»</text>
<rect x="26.0" y="58" width="168" height="54" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="110" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#202124">Пользователь</text>
<line x1="110" y1="112" x2="110" y2="688" stroke="#bdc1c6" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="246.0" y="58" width="168" height="54" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="330" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#202124">Слой интеграции</text>
<line x1="330" y1="112" x2="330" y2="688" stroke="#bdc1c6" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="486.0" y="58" width="168" height="54" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="570" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#202124">AuthModule</text>
<line x1="570" y1="112" x2="570" y2="688" stroke="#bdc1c6" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="686.0" y="58" width="168" height="54" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="770" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#202124">TaskModule</text>
<line x1="770" y1="112" x2="770" y2="688" stroke="#bdc1c6" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="886.0" y="58" width="168" height="54" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
<text x="970" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#202124">ReportModule</text>
<line x1="970" y1="112" x2="970" y2="688" stroke="#bdc1c6" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="110" y1="174" x2="330" y2="174" stroke="#3c4043" stroke-width="1.6" stroke-dasharray="none" marker-end="url(#arrow)"/>
<text x="220.0" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">POST /api/auth/login</text>
<text x="96" y="178" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5f6368">1</text>
<line x1="330" y1="206" x2="570" y2="206" stroke="#3c4043" stroke-width="1.6" stroke-dasharray="none" marker-end="url(#arrow)"/>
<text x="450.0" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">login_user(логин, пароль)</text>
<text x="316" y="210" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5f6368">2</text>
<line x1="570" y1="238" x2="330" y2="238" stroke="#1e8e3e" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-open)"/>
<text x="450.0" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">access_token (JWT)</text>
<text x="316" y="242" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5f6368">3</text>
<line x1="110" y1="282" x2="330" y2="282" stroke="#3c4043" stroke-width="1.6" stroke-dasharray="none" marker-end="url(#arrow)"/>
<text x="220.0" y="274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">POST /api/tasks + Bearer</text>
<text x="96" y="286" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5f6368">4</text>
<line x1="330" y1="340" x2="570" y2="340" stroke="#3c4043" stroke-width="1.6" stroke-dasharray="none" marker-end="url(#arrow)"/>
<text x="450.0" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">decode_access_token()</text>
<text x="316" y="344" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5f6368">5</text>
<line x1="570" y1="372" x2="330" y2="372" stroke="#1e8e3e" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-open)"/>
<text x="450.0" y="364" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">payload {user_id, role}</text>
<text x="316" y="376" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5f6368">6</text>
<line x1="330" y1="420" x2="770" y2="420" stroke="#3c4043" stroke-width="1.6" stroke-dasharray="none" marker-end="url(#arrow)"/>
<text x="550.0" y="412" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">create_task(...)</text>
<text x="316" y="424" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5f6368">7</text>
<line x1="770" y1="452" x2="330" y2="452" stroke="#1e8e3e" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-open)"/>
<text x="550.0" y="444" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">задача {id, status='new'}</text>
<text x="316" y="456" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5f6368">8</text>
<line x1="770" y1="500" x2="330" y2="500" stroke="#3c4043" stroke-width="1.6" stroke-dasharray="none" marker-end="url(#arrow)"/>
<text x="550.0" y="492" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">запись в task_history</text>
<text x="316" y="504" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5f6368">9</text>
<line x1="110" y1="548" x2="330" y2="548" stroke="#3c4043" stroke-width="1.6" stroke-dasharray="none" marker-end="url(#arrow)"/>
<text x="220.0" y="540" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">GET /api/reports/by-project/{id}</text>
<text x="96" y="552" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5f6368">10</text>
<line x1="330" y1="580" x2="970" y2="580" stroke="#3c4043" stroke-width="1.6" stroke-dasharray="none" marker-end="url(#arrow)"/>
<text x="650.0" y="572" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">generate_report_by_project()</text>
<text x="316" y="584" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5f6368">11</text>
<line x1="970" y1="612" x2="330" y2="612" stroke="#1e8e3e" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-open)"/>
<text x="650.0" y="604" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">отчёт {tasks, statistics}</text>
<text x="316" y="616" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5f6368">12</text>
<line x1="330" y1="660" x2="110" y2="660" stroke="#1e8e3e" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-open)"/>
<text x="220.0" y="652" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">JSON-ответ: задача в отчёте</text>
<text x="96" y="664" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5f6368">13</text>
<rect x="86" y="700" width="908" height="52" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.4"/>
<text x="100" y="722" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">Шаги 4–6 (единый механизм аутентификации): токен, выданный AuthModule, проверяется перед вызовом TaskModule и ReportModule.</text>
<text x="100" y="740" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">Сплошные стрелки — вызовы, пунктирные — возврат результата; номера соответствуют порядку выполнения.</text>
<text x="540" y="774" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f6368">Соответствует обработчикам src/api.py и тесту test_integration.test_api_full_workflow_over_http</text>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3c4043"/></marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#3c4043" stroke-width="1.6"/></marker>
</defs>
</svg>