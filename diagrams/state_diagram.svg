<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740">
<rect width="1000" height="740" fill="#ffffff"/>
<text x="500" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#202124">Диаграмма состояний задачи (TaskModule)</text>
<circle cx="465" cy="120" r="12" fill="#1e8e3e"/>
<text x="445" y="118" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#3c4043">создание</text>
<text x="445" y="136" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#3c4043">задачи</text>
<line x1="478.0" y1="120.0" x2="549.0" y2="120.0" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="660.0" y1="158.0" x2="660.0" y2="247.0" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="800.0" y="203.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#3c4043">T1 · взять в работу</text>
<line x1="660.0" y1="323.0" x2="660.0" y2="412.0" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="800.0" y="368.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#3c4043">T3 · отправить на проверку</text>
<line x1="660.0" y1="488.0" x2="660.0" y2="577.0" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="802.0" y="533.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#3c4043">T5 · принять результат</text>
<path d="M 581.9 155.0 Q 386.3 166.1 248.1 305.0" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="430.0" y="243.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#3c4043">T2 · отклонить</text>
<path d="M 550.0 297.3 Q 408.3 252.9 280.0 327.7" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="243.0" y="448.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#3c4043">T4 · прекратить работу</text>
<path d="M 660.0 417.0 C 540.0 407.0, 540.0 328.0, 660.0 318.0" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="300.0" y="398.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#3c4043">T6 · вернуть на доработку</text>
<path d="M 660.0 582.0 C 845.0 532.0, 845.0 368.0, 660.0 318.0" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="905.0" y="385.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#3c4043">T8 · переоткрыть</text>
<path d="M 243.5 307.0 C 68.5 272.0, 411.5 118.0, 586.5 153.0" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="470.0" y="200.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#3c4043">T7 · вернуть в работу</text>
<rect x="555.0" y="87.0" width="210.0" height="66.0" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
<text x="660.0" y="108.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#202124">Новая</text>
<text x="660.0" y="127.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#3c4043">tasks.status = 'new'</text>
<rect x="555.0" y="252.0" width="210.0" height="66.0" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
<text x="660.0" y="273.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#202124">В работе</text>
<text x="660.0" y="292.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#3c4043">tasks.status = 'in_progress'</text>
<rect x="555.0" y="417.0" width="210.0" height="66.0" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
<text x="660.0" y="438.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#202124">На проверке</text>
<text x="660.0" y="457.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#3c4043">tasks.status = 'review'</text>
<rect x="555.0" y="582.0" width="210.0" height="66.0" rx="8" fill="#f1f3f4" stroke="#1a73e8" stroke-width="1.6"/>
<text x="660.0" y="603.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#202124">Завершена</text>
<text x="660.0" y="622.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#3c4043">tasks.status = 'completed'</text>
<rect x="65.0" y="307.0" width="210.0" height="66.0" rx="8" fill="#f1f3f4" stroke="#1a73e8" stroke-width="1.6"/>
<text x="170.0" y="328.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#202124">Отклонена</text>
<text x="170.0" y="347.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#3c4043">tasks.status = 'rejected'</text>
<rect x="400" y="655" width="570" height="56" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.4"/>
<text x="414" y="673" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">T1–T8 — переходы матрицы переходов (docs/transition_matrix.md).</text>
<text x="414" y="688" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">Роли: менеджер и администратор — все переходы; исполнитель — T1 и T3.</text>
<text x="414" y="703" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#202124">Запрещённые переходы: completed → new, review → rejected, new → completed.</text>
<text x="500" y="732" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f6368">Модель построена по данным src/core/models.py (STATUS_TRANSITIONS)</text>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3c4043"/></marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#3c4043" stroke-width="1.6"/></marker>
</defs>
</svg>