<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760">
<rect width="1080" height="760" fill="#ffffff"/>
<text x="540" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#202124">ER-диаграмма базы данных ProjectFlow</text>
<path d="M 350.0 176.0 C 392.0 188.0, 392.0 202.0, 430.0 214.0" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="390.0" y="172.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#3c4043">1:N · владеет</text>
<path d="M 350.0 440.0 C 390.0 420.0, 390.0 360.0, 430.0 300.0" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="392.0" y="356.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#3c4043">1:N · содержит</text>
<path d="M 350.0 150.0 C 560.0 60.0, 800.0 60.0, 940.0 150.0" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="640.0" y="78.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#3c4043">1:N · порождает</text>
<path d="M 590.0 400.0 C 590.0 450.0, 590.0 480.0, 590.0 520.0" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="716.0" y="466.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#3c4043">1:N · журнал статусов</text>
<path d="M 50.0 300.0 C -30.0 330.0, -30.0 430.0, 50.0 440.0" fill="none" stroke="#3c4043" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="96.0" y="378.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#3c4043">1:N · владелец проекта</text>
<rect x="50" y="90" width="300" height="172" rx="8" fill="#f1f3f4" stroke="#1a73e8" stroke-width="1.6"/>
<rect x="50" y="90" width="300" height="28" rx="8" fill="#d2e3fc" stroke="#1a73e8" stroke-width="1.6"/>
<text x="62" y="109" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#202124">users</text>
<text x="62" y="136" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">PK  id            INTEGER</text>
<text x="62" y="151" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    username      VARCHAR(50) UNIQUE</text>
<text x="62" y="166" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    email         VARCHAR(120) UNIQUE</text>
<text x="62" y="181" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    password_hash VARCHAR(255)</text>
<text x="62" y="196" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    role          VARCHAR(20)</text>
<text x="62" y="211" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    is_active     INTEGER</text>
<text x="62" y="226" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    reset_token   VARCHAR(128)</text>
<text x="62" y="241" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    created_at    TEXT</text>
<rect x="50" y="390" width="300" height="127" rx="8" fill="#f1f3f4" stroke="#1a73e8" stroke-width="1.6"/>
<rect x="50" y="390" width="300" height="28" rx="8" fill="#d2e3fc" stroke="#1a73e8" stroke-width="1.6"/>
<text x="62" y="409" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#202124">projects</text>
<text x="62" y="436" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">PK  id          INTEGER</text>
<text x="62" y="451" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    name        VARCHAR(120) UNIQUE</text>
<text x="62" y="466" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    description VARCHAR(500)</text>
<text x="62" y="481" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">FK  owner_id    → users.id</text>
<text x="62" y="496" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    created_at  TEXT</text>
<rect x="430" y="130" width="320" height="202" rx="8" fill="#f1f3f4" stroke="#1a73e8" stroke-width="1.6"/>
<rect x="430" y="130" width="320" height="28" rx="8" fill="#d2e3fc" stroke="#1a73e8" stroke-width="1.6"/>
<text x="442" y="149" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#202124">tasks</text>
<text x="442" y="176" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">PK  id          INTEGER</text>
<text x="442" y="191" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    title       VARCHAR(150)</text>
<text x="442" y="206" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    description VARCHAR(1000)</text>
<text x="442" y="221" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    status      VARCHAR(20)  ← диаграмма состояний</text>
<text x="442" y="236" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    priority    VARCHAR(10)</text>
<text x="442" y="251" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    due_date    TEXT</text>
<text x="442" y="266" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">FK  project_id  → projects.id  (CASCADE)</text>
<text x="442" y="281" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">FK  assigned_to → users.id     (SET NULL)</text>
<text x="442" y="296" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">FK  created_by  → users.id     (SET NULL)</text>
<text x="442" y="311" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    created_at / updated_at</text>
<rect x="840" y="150" width="200" height="142" rx="8" fill="#f1f3f4" stroke="#1a73e8" stroke-width="1.6"/>
<rect x="840" y="150" width="200" height="28" rx="8" fill="#d2e3fc" stroke="#1a73e8" stroke-width="1.6"/>
<text x="852" y="169" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#202124">reports</text>
<text x="852" y="196" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">PK  id         INTEGER</text>
<text x="852" y="211" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    name       VARCHAR(255)</text>
<text x="852" y="226" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    type       VARCHAR(50)</text>
<text x="852" y="241" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    params     TEXT (JSON)</text>
<text x="852" y="256" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">FK  created_by → users.id</text>
<text x="852" y="271" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    created_at TEXT</text>
<rect x="430" y="520" width="320" height="142" rx="8" fill="#f1f3f4" stroke="#1a73e8" stroke-width="1.6"/>
<rect x="430" y="520" width="320" height="28" rx="8" fill="#d2e3fc" stroke="#1a73e8" stroke-width="1.6"/>
<text x="442" y="539" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#202124">task_history</text>
<text x="442" y="566" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">PK  id         INTEGER</text>
<text x="442" y="581" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">FK  task_id    → tasks.id (CASCADE)</text>
<text x="442" y="596" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    from_status VARCHAR(20)</text>
<text x="442" y="611" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    to_status   VARCHAR(20)</text>
<text x="442" y="626" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">FK  changed_by → users.id</text>
<text x="442" y="641" font-family="Consolas, monospace" font-size="10.5" fill="#3c4043">    changed_at TEXT</text>
<text x="30" y="698" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#202124">PK — первичный ключ, FK — внешний ключ. CASCADE — удаление связанных записей, SET NULL — обнуление ссылки.</text>
<text x="30" y="716" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#202124">tasks.status соответствует диаграмме состояний задачи; изменения статусов фиксируются в task_history и используются модулем отчётности.</text>
<text x="540" y="748" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5f6368">Схема соответствует DDL-скрипту src/core/database.py (SCHEMA_SQL)</text>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3c4043"/></marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#3c4043" stroke-width="1.6"/></marker>
</defs>
</svg>